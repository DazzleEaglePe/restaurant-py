# Entorno local (docs/11_ESTRUCTURA_PROYECTO.md §9). Los puertos son distintos a
# los de Yallegó para correr ambos proyectos a la vez.
name: resto-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resto
      POSTGRES_PASSWORD: resto_dev
      POSTGRES_DB: resto
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resto -d resto']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '${MAILPIT_SMTP_PORT:-1026}:1025'
      - '${MAILPIT_UI_PORT:-8026}:8025'
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
