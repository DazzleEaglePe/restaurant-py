packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Versiones corregidas de dependencias transitivas, las mismas que Yallegó
# fijó para dejar en verde `pnpm audit --prod` (yallego-app PR #4).
overrides:
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  engine.io: 6.6.11
  multer: 2.4.0
  postcss: 8.5.26
  proxy-addr: 2.0.8
  qs: 6.16.0
  sharp: 0.35.5
  source-map-js: 1.2.2

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
